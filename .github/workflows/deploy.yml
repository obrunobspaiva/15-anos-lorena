name: Deploy → EasyPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger EasyPanel deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy webhook
        run: |
          curl -sf --max-time 30 --retry 3 -X GET \
            "${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}"